name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting a feature, check the roadmap and known limitations in the [README](https://github.com/DIVESHvalecha/SnippetVault#roadmap-and-known-limitations).
        AI semantic search is **not** implemented in this repository; requests for it are welcome but should be framed as new work.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user problem, not the implementation.
      placeholder: I want to find snippets by meaning rather than exact words because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the app do? Include API or UI shape if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend
        - Chrome extension
        - Database schema
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I can open a pull request"
        - "Yes, with guidance"
        - "No, just suggesting"
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the known limitations.
          required: true
        - label: This request does not depend on unverified features being described as already built.
          required: true

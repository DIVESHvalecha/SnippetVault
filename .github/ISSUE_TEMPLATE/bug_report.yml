name: Bug report
description: Report a reproducible problem in the backend, frontend, or extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues and read [docs/troubleshooting.md](https://github.com/DIVESHvalecha/SnippetVault/blob/main/docs/troubleshooting.md) first.
        Do **not** include passwords, tokens, connection strings, or personal documents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
      placeholder: When I click Fork on revision 2, ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The behavior you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the problem.
      placeholder: |
        1. Start MySQL, backend, and frontend
        2. Log in as ...
        3. Open ...
        4. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend
        - Chrome extension
        - Database schema
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD` or the version you are running.
      placeholder: 3e07cb9
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, JDK, Node.js, MySQL, and browser versions.
      placeholder: |
        macOS 15
        OpenJDK 22
        Node 23.5.0
        MySQL 9.2
        Chrome 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste stack traces or attach screenshots. Remove secrets first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the troubleshooting guide.
          required: true
        - label: I removed credentials, tokens, and personal data from this report.
          required: true
